[package]
name = "omk-skroot-loader"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE.md"
build = "build.rs"

[workspace]

[lib]
name = "omk_skroot_loader"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "omk-skroot-worker"
path = "src/bin/worker.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
