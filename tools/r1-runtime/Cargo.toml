[package]
name = "r1-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "r1-helper"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "~3.1", default-features = false, features = ["rustls"] }
