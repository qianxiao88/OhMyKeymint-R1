name: Build OhMyKeymint

on:
  push:
    tags:
      - '*'
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '!.github/workflows/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-boringssl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Clone BoringSSL
      run: |
        git clone https://boringssl.googlesource.com/boringssl

    - name: Cache BoringSSL build
      uses: actions/cache@v6
      id: boringssl-cache
      with:
        path: boringssl/build
        key: boringssl-ndk30-api26-${{ hashFiles('boringssl/.git/HEAD', 'boringssl/.git/refs/heads/main') }}

    - name: Install Rust toolchain
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: aarch64-linux-android

    - name: Install Android SDK
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install Android NDK and bindgen
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        cargo install bindgen-cli
        echo "y" | sdkmanager --install "ndk;30.0.16248370" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "y" | sdkmanager --install "ndk-bundle" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "y" | sdkmanager --install "cmake;4.1.2" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null

    - name: Install build dependencies
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-multilib

    - name: Build BoringSSL
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        cd boringssl
        export PATH="~/.cargo/bin:$PATH"
        $ANDROID_SDK_ROOT/cmake/4.1.2/bin/cmake -GNinja -B build \
          -DRUST_BINDINGS=aarch64-linux-android \
          -DCMAKE_SYSROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/sysroot/ \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/30.0.16248370/build/cmake/android.toolchain.cmake \
          -DCMAKE_C_FLAGS=-mno-outline-atomics \
          -DCMAKE_CXX_FLAGS=-mno-outline-atomics \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26
        ninja -j$(nproc) -C build
    - name: Tar BoringSSL
      run: |
        tar czf boringssl.tar.gz boringssl/build boringssl/rust
    
    - name: Output BoringSSL
      uses: actions/upload-artifact@v7
      with:
        name: boringssl.tar.gz
        path: boringssl.tar.gz
        retention-days: 3

  lint:
    runs-on: ubuntu-latest
    needs: build-boringssl
    permissions:
      contents: read
    env:
      BORINGSSL_BUILD_DIR: ${{ github.workspace }}/boringssl/build
      CARGO_HUSKY_DONT_INSTALL_HOOKS: '1'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: aarch64-linux-android
        components: rustfmt, clippy

    - name: Install cargo-deny
      run: cargo install cargo-deny --version 0.20.2 --locked

    - name: Install Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Install Android build dependencies
      run: |
        sdkmanager --install "ndk;30.0.16248370" "build-tools;35.0.0" "cmake;4.1.2" --sdk_root="$ANDROID_SDK_ROOT"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Download BoringSSL
      uses: actions/download-artifact@v8
      with:
        name: boringssl.tar.gz
        path: .

    - name: Configure Cargo for Android target
      run: |
        tar xf boringssl.tar.gz
        python scripts/setup_cargo_config.py \
          --force \
          --ndk-root "$ANDROID_SDK_ROOT/ndk/30.0.16248370" \
          --api-level 26 \
          --host-tag linux-x86_64
        cat >> .cargo/config.toml <<EOF

        [patch.crates-io]
        bssl-sys = { path = "$GITHUB_WORKSPACE/boringssl/rust/bssl-sys" }
        EOF

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check Android variants and standalone workspaces
      run: |
        cargo clippy --target aarch64-linux-android --workspace --all-targets -- -D warnings
        cargo test --target aarch64-linux-android --workspace --no-run
        for gate in clippy test; do
          if [ "$gate" = clippy ]; then extra=(--all-targets -- -D warnings); else extra=(--no-run); fi
          cargo "$gate" --target aarch64-linux-android -p OhMyKeymint --no-default-features --features pif,local-rkp "${extra[@]}"
          cargo "$gate" --target aarch64-linux-android -p OhMyKeymint --no-default-features "${extra[@]}"
          cargo "$gate" --target aarch64-linux-android -p injector --no-default-features "${extra[@]}"
          for manifest in tools/r1-runtime/Cargo.toml tools/skroot-loader/Cargo.toml; do
            cargo "$gate" --manifest-path "$manifest" --target aarch64-linux-android "${extra[@]}"
          done
        done

    - name: Check dependencies
      run: cargo deny --workspace check

  setup-and-build:
    name: Package R1 (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    needs:
      - build-boringssl
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        build-type: [debug, release]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.1
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: Install and test WebUI
      run: |
        pnpm --dir webui install --frozen-lockfile
        pnpm --dir webui test

    - name: Test source packaging
      run: |
        python -m unittest discover -s tests -p 'test_*.py'
        python -m unittest discover -s scripts -p test_build_r1.py

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: aarch64-linux-android

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install Android NDK and bridge build tools
      run: |
        echo "y" | sdkmanager --install "ndk;30.0.16248370" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "y" | sdkmanager --install "build-tools;35.0.0" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "y" | sdkmanager --install "cmake;4.1.2" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
    - name: Install protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Download BoringSSL
      uses: actions/download-artifact@v8
      with:
        name: boringssl.tar.gz
        path: .

    - name: Configure Cargo for Android target
      run: |
        tar xf boringssl.tar.gz
        python scripts/setup_cargo_config.py \
          --force \
          --ndk-root "$ANDROID_SDK_ROOT/ndk/30.0.16248370" \
          --api-level 26 \
          --host-tag linux-x86_64
        cat >> .cargo/config.toml <<EOF

        [patch.crates-io]
        bssl-sys = { path = "$GITHUB_WORKSPACE/boringssl/rust/bssl-sys" }
        EOF

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install toml

    - name: Build three source variants and SKRootPro transports
      env:
        BORINGSSL_BUILD_DIR: ${{ github.workspace }}/boringssl/build
      run: |
        unset RUSTFLAGS
        python build.py --${{ matrix.build-type }} --variant all --output target/packages

    - name: Summarize packaged outputs
      env:
        BUILD_TYPE: ${{ matrix.build-type }}
      run: |
        python - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import zipfile

        output = Path("target/packages")
        packages = sorted(output.glob("*.zip")) + sorted((output / "skrootpro").glob("*.zip"))
        if len(packages) != 6:
            raise SystemExit(f"Expected six source-built ZIPs, found {len(packages)}")
        summaries, sums = {}, []
        for package in packages:
            with package.open("rb") as stream:
                digest = hashlib.file_digest(stream, "sha256").hexdigest()
            relative = package.relative_to(output).as_posix()
            expected = f"{digest}  {package.name}\n"
            if package.with_suffix(".zip.sha256").read_text(encoding="ascii") != expected:
                raise SystemExit(f"ZIP sidecar mismatch: {relative}")
            with zipfile.ZipFile(package) as archive:
                manifest = "skroot-build.json" if package.parent.name == "skrootpro" else "r1-build.json"
                summaries[relative] = json.loads(archive.read(manifest))
            sums.append(f"{digest}  {relative}\n")
        (output / "SHA256SUMS").write_text("".join(sums), encoding="ascii")
        (output / "build-summary.json").write_text(json.dumps(summaries, sort_keys=True, indent=2) + "\n", encoding="utf-8")
        report = f"### R1 {os.environ['BUILD_TYPE']} packages\n\n" + "\n".join(f"- `{name}`" for name in summaries) + "\n"
        (output / "build-summary.md").write_text(report, encoding="utf-8")
        with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
            stream.write(report)
        PY

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: OhMyKeymint-R1-${{ matrix.build-type }}-${{ github.sha }}
        path: |
          target/packages/*.zip
          target/packages/*.zip.sha256
          target/packages/skrootpro/*.zip
          target/packages/skrootpro/*.zip.sha256
          target/packages/SHA256SUMS
          target/packages/build-summary.json
          target/packages/build-summary.md
        if-no-files-found: error
        retention-days: 90

    - name: Attest release package provenance
      if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.build-type == 'release' }}
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          target/packages/*.zip
          target/packages/skrootpro/*.zip
